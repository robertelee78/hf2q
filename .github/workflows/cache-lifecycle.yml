name: Cache lifecycle

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact main-branch commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cache-lifecycle-${{ inputs.commit_sha }}
  cancel-in-progress: false

jobs:
  build-release-candidate:
    name: build exact packed Apple-Silicon candidate
    runs-on: [self-hosted, macOS, ARM64, hf2q-gates]
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      EXPECTED_VERSION: "0.1.7"
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA"
          git fetch origin main
          test "$actual_sha" = "$(git rev-parse origin/main)"
          git diff --exit-code

      - name: Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88.0"

      - name: Package and build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          if [[ ${MLX_NATIVE_SKIP_METALLIB+x} ]]; then
            echo "MLX_NATIVE_SKIP_METALLIB is forbidden for exact-artifact builds" >&2
            exit 1
          fi
          actual_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$actual_version" = "$EXPECTED_VERSION"
          checkout_root=$(pwd -P)
          cargo package --locked --no-verify
          crate="$GITHUB_WORKSPACE/target/package/hf2q-${EXPECTED_VERSION}.crate"
          test -s "$crate"
          crate_sha=$(shasum -a 256 "$crate" | awk '{print $1}')

          packed_build_root=$(mktemp -d "/private/var/tmp/hf2q-packed-build.XXXXXX")
          printf 'PACKED_BUILD_ROOT=%s\n' "$packed_build_root" >> "$GITHUB_ENV"
          cargo_home=$(mktemp -d "$RUNNER_TEMP/hf2q-packed-cargo-home.XXXXXX")
          cargo_target=$(mktemp -d "$RUNNER_TEMP/hf2q-packed-target.XXXXXX")
          provenance_stage=$(mktemp -d "$RUNNER_TEMP/hf2q-dependency-provenance.XXXXXX")
          metadata_stage=$(mktemp -d "$RUNNER_TEMP/hf2q-metadata-stage.XXXXXX")
          test -z "$(find "$cargo_home" -mindepth 1 -print -quit)"
          /usr/bin/tar -xzf "$crate" -C "$packed_build_root"
          package_root=$(cd "$packed_build_root/hf2q-${EXPECTED_VERSION}" && pwd -P)
          trusted_verifier="$checkout_root/scripts/verify_release_dependency_provenance.sh"
          cargo_env=(env)
          while IFS='=' read -r variable_name _; do
            case "$variable_name" in
              RUSTUP_TOOLCHAIN|RUSTC|RUSTDOC|RUSTFLAGS|RUSTDOCFLAGS|CARGO_ENCODED_RUSTFLAGS|CARGO_ENCODED_RUSTDOCFLAGS|RUSTC_*|RUSTDOC_*|CARGO_BUILD_*|CARGO_PROFILE_*|CARGO_TARGET_*)
                cargo_env+=(-u "$variable_name")
                ;;
            esac
          done < <(env)
          cargo_env+=(CARGO_HOME="$cargo_home" CARGO_TARGET_DIR="$cargo_target" MACOSX_DEPLOYMENT_TARGET=14.0)
          bash "$trusted_verifier" \
            check-build-root "$package_root" "$checkout_root" \
            "$cargo_home" "$cargo_target"
          "${cargo_env[@]}" bash "$trusted_verifier" \
            check-build-env "$cargo_home" "$cargo_target"
          case "$package_root/" in
            "$checkout_root/"*)
              echo "packed build root must be outside checkout ancestry" >&2
              exit 1
              ;;
          esac

          (
            cd "$package_root"
            "${cargo_env[@]}" cargo metadata --locked --format-version 1 \
              > "$metadata_stage/cargo-metadata.json"
            bash "$trusted_verifier" capture \
              "$package_root" "$metadata_stage/cargo-metadata.json" \
              "$provenance_stage" "$checkout_root" "$cargo_home" \
              "$cargo_target" true true "$crate_sha"
            "${cargo_env[@]}" bash "$trusted_verifier" \
              check-build-env "$cargo_home" "$cargo_target"
            bash "$trusted_verifier" check-build-root \
              "$package_root" "$checkout_root" "$cargo_home" "$cargo_target"
            "${cargo_env[@]}" cargo build --release --locked
            bash "$trusted_verifier" check-build-root \
              "$package_root" "$checkout_root" "$cargo_home" "$cargo_target"
          )
          built_binary="$cargo_target/release/hf2q"
          test -x "$built_binary"
          test "$(/usr/bin/lipo -archs "$built_binary")" = arm64
          test "$(/usr/bin/vtool -show-build "$built_binary" | awk '$1 == "minos" {print $2}')" = 14.0
          test "$(HF2Q_NO_COMPLETION_INSTALL=1 "$built_binary" --version)" = \
            "hf2q $EXPECTED_VERSION"
          built_sha=$(shasum -a 256 "$built_binary" | awk '{print $1}')

          candidate_root="$RUNNER_TEMP/cache-lifecycle-build-$EXPECTED_SHA"
          test ! -e "$candidate_root"
          mkdir -m 0700 "$candidate_root"
          mkdir -m 0700 "$candidate_root/dependency-provenance"
          cp "$built_binary" "$candidate_root/hf2q-unsigned"
          chmod 0555 "$candidate_root/hf2q-unsigned"
          cp "$crate" "$candidate_root/hf2q-${EXPECTED_VERSION}.crate"
          cp -R "$provenance_stage/." "$candidate_root/dependency-provenance/"
          jq -nS \
            --arg source_sha "$EXPECTED_SHA" \
            --arg version "$EXPECTED_VERSION" \
            --arg crate_sha256 "$crate_sha" \
            --arg binary_sha256 "$built_sha" \
            '{kind:"hf2q.standalone-build-candidate",schema_version:1,source_sha:$source_sha,version:$version,target:"aarch64-apple-darwin",minimum_macos:"14.0",crate_sha256:$crate_sha256,unsigned_binary_sha256:$binary_sha256}' \
            > "$candidate_root/build.json"
          chmod 0444 "$candidate_root/build.json" \
            "$candidate_root/hf2q-${EXPECTED_VERSION}.crate"
          printf 'CANDIDATE_ROOT=%s\n' "$candidate_root" >> "$GITHUB_ENV"

      - name: Upload unsigned exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-lifecycle-build-${{ inputs.commit_sha }}
          path: ${{ env.CANDIDATE_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Clean external packed build root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packed_build_root=${PACKED_BUILD_ROOT:-}
          [[ -n "$packed_build_root" ]] || exit 0
          case "$packed_build_root" in
            /private/var/tmp/hf2q-packed-build.*)
              suffix=${packed_build_root#/private/var/tmp/hf2q-packed-build.}
              [[ -n "$suffix" && "$suffix" != */* ]] || exit 1
              ;;
            *)
              echo "refusing unsafe packed-build cleanup: $packed_build_root" >&2
              exit 1
              ;;
          esac
          [[ -d "$packed_build_root" && ! -L "$packed_build_root" ]] || exit 0
          rm -rf -- "$packed_build_root"

  sign-release-candidate:
    name: Developer ID sign and notarize exact candidate
    needs: build-release-candidate
    runs-on: macos-latest
    environment: apple-release
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      EXPECTED_VERSION: "0.1.7"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          git diff --exit-code

      - name: Download exact build candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cache-lifecycle-build-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/cache-lifecycle-build

      - name: Verify, sign, and notarize
        shell: bash
        env:
          APPLE_DEVELOPER_ID_APPLICATION: ${{ vars.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_CODESIGN_IDENTIFIER: ${{ vars.APPLE_CODESIGN_IDENTIFIER }}
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/cache-lifecycle-build"
          build_receipt="$build_root/build.json"
          test -z "$(find "$build_root" -type l -print -quit)"
          test "$(find "$build_root" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 4
          jq -e \
            --arg source_sha "$EXPECTED_SHA" \
            --arg version "$EXPECTED_VERSION" '
              .kind == "hf2q.standalone-build-candidate"
              and .schema_version == 1
              and .source_sha == $source_sha
              and .version == $version
              and .target == "aarch64-apple-darwin"
              and .minimum_macos == "14.0"
              and (.crate_sha256 | test("^[0-9a-f]{64}$"))
              and (.unsigned_binary_sha256 | test("^[0-9a-f]{64}$"))
            ' "$build_receipt" >/dev/null
          unsigned="$build_root/hf2q-unsigned"
          chmod 0555 "$unsigned"
          test "$(shasum -a 256 "$unsigned" | awk '{print $1}')" = \
            "$(jq -er .unsigned_binary_sha256 "$build_receipt")"
          crate="$build_root/hf2q-${EXPECTED_VERSION}.crate"
          test "$(shasum -a 256 "$crate" | awk '{print $1}')" = \
            "$(jq -er .crate_sha256 "$build_receipt")"
          package_stage=$(mktemp -d "$RUNNER_TEMP/hf2q-sign-package.XXXXXX")
          echo "SIGN_PACKAGE_STAGE=$package_stage" >> "$GITHUB_ENV"
          /usr/bin/tar -xzf "$crate" -C "$package_stage"
          package_root="$package_stage/hf2q-${EXPECTED_VERSION}"
          test -x "$package_root/scripts/sign_notarize_standalone_release.sh"
          test "$APPLE_CODESIGN_IDENTIFIER" = us.hf2q.cli
          signed_stage="$RUNNER_TEMP/cache-lifecycle-signed-$EXPECTED_SHA"
          export APPLE_RELEASE_SECRET_DIRECTORY="$RUNNER_TEMP/hf2q-apple-release-secrets-$EXPECTED_SHA"
          "$package_root/scripts/sign_notarize_standalone_release.sh" \
            "$unsigned" "$signed_stage" "$EXPECTED_VERSION" "$EXPECTED_SHA" \
            "$APPLE_TEAM_ID" "$APPLE_CODESIGN_IDENTIFIER"

      - name: Upload exact signed release candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-lifecycle-signed-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/cache-lifecycle-signed-${{ inputs.commit_sha }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove Apple credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          scratch="$RUNNER_TEMP/hf2q-apple-release-secrets-$EXPECTED_SHA"
          case "$scratch" in
            "$RUNNER_TEMP"/hf2q-apple-release-secrets-*) ;;
            *) exit 1 ;;
          esac
          if [[ -e "$scratch/release.keychain-db" ]]; then
            /usr/bin/security delete-keychain "$scratch/release.keychain-db" \
              >/dev/null 2>&1 || true
          fi
          [[ ! -d "$scratch" || -L "$scratch" ]] || rm -rf -- "$scratch"
          package_stage=${SIGN_PACKAGE_STAGE:-}
          case "$package_stage" in
            "$RUNNER_TEMP"/hf2q-sign-package.*)
              [[ ! -d "$package_stage" || -L "$package_stage" ]] || \
                rm -rf -- "$package_stage"
              ;;
            '') ;;
            *) exit 1 ;;
          esac

  exact-artifact-cache-lifecycle:
    name: exact signed artifact · DeepSeek + Gemma + Qwen + Qwen3.8
    needs: sign-release-candidate
    runs-on: [self-hosted, macOS, ARM64, hf2q-gates]
    timeout-minutes: 300
    env:
      EXPECTED_SHA: ${{ inputs.commit_sha }}
      EXPECTED_VERSION: "0.1.7"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main identity and model paths
        shell: bash
        env:
          DEEPSEEK_MODEL_PATH: ${{ vars.DEEPSEEK4_MODEL_PATH }}
          GEMMA_MODEL_PATH: ${{ vars.GEMMA4_MODEL_PATH }}
          QWEN_MODEL_PATH: ${{ vars.QWEN36_MODEL_PATH }}
          QWEN38_MODEL_PATH: ${{ vars.QWEN38_MODEL_PATH }}
          DEEPSEEK_MODEL_SHA256: ${{ vars.DEEPSEEK4_MODEL_SHA256 }}
          GEMMA_MODEL_SHA256: ${{ vars.GEMMA4_MODEL_SHA256 }}
          QWEN_MODEL_SHA256: ${{ vars.QWEN36_MODEL_SHA256 }}
          QWEN38_MODEL_SHA256: ${{ vars.QWEN38_MODEL_SHA256 }}
        run: |
          set -euo pipefail
          actual_sha=$(git rev-parse HEAD)
          test "$actual_sha" = "$EXPECTED_SHA"
          git fetch origin main
          test "$actual_sha" = "$(git rev-parse origin/main)"
          git diff --exit-code

          for model in "$DEEPSEEK_MODEL_PATH" "$GEMMA_MODEL_PATH" \
            "$QWEN_MODEL_PATH" "$QWEN38_MODEL_PATH"; do
            [[ "$model" != *$'\n'* && "$model" != *$'\r'* ]]
            test -f "$model"
          done
          for digest in "$DEEPSEEK_MODEL_SHA256" "$GEMMA_MODEL_SHA256" \
            "$QWEN_MODEL_SHA256" "$QWEN38_MODEL_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          done
          {
            printf 'DEEPSEEK_MODEL=%s\n' "$DEEPSEEK_MODEL_PATH"
            printf 'GEMMA_MODEL=%s\n' "$GEMMA_MODEL_PATH"
            printf 'QWEN_MODEL=%s\n' "$QWEN_MODEL_PATH"
            printf 'QWEN38_MODEL=%s\n' "$QWEN38_MODEL_PATH"
            printf 'DEEPSEEK_MODEL_SHA256=%s\n' "$DEEPSEEK_MODEL_SHA256"
            printf 'GEMMA_MODEL_SHA256=%s\n' "$GEMMA_MODEL_SHA256"
            printf 'QWEN_MODEL_SHA256=%s\n' "$QWEN_MODEL_SHA256"
            printf 'QWEN38_MODEL_SHA256=%s\n' "$QWEN38_MODEL_SHA256"
          } >> "$GITHUB_ENV"

      - name: Toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88.0"

      - name: Download exact build and signed candidates
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cache-lifecycle-*-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/cache-lifecycle-inputs

      - name: Bind the signed artifact to the packed source and proof
        shell: bash
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/cache-lifecycle-inputs/cache-lifecycle-build-$EXPECTED_SHA"
          signed_root="$RUNNER_TEMP/cache-lifecycle-inputs/cache-lifecycle-signed-$EXPECTED_SHA"
          build_receipt="$build_root/build.json"
          signed_receipt="$signed_root/proof.json"
          test -z "$(find "$build_root" "$signed_root" -type l -print -quit)"
          test "$(find "$build_root" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 4
          test "$(find "$signed_root" -mindepth 1 -maxdepth 1 -print | wc -l | tr -d ' ')" = 8
          crate_sha=$(jq -er .crate_sha256 "$build_receipt")
          binary_sha=$(jq -er .asset.sha256 "$signed_receipt")
          jq -e \
            --arg source_sha "$EXPECTED_SHA" \
            --arg version "$EXPECTED_VERSION" \
            --arg binary_sha "$binary_sha" '
              .kind == "hf2q.standalone-apple-release-proof"
              and .schema_version == 1
              and .source_sha == $source_sha
              and .version == $version
              and .target == "aarch64-apple-darwin"
              and .asset.name == "hf2q-aarch64-apple-darwin"
              and .asset.sha256 == $binary_sha
              and .signing.authority == "Developer ID Application"
              and .signing.hardened_runtime == true
              and .signing.secure_timestamp == true
              and .notarization.status == "Accepted"
              and .notarization.standalone_ticket_stapled == false
              and .verification.codesign == "accepted"
              and .verification.gatekeeper == "Notarized Developer ID"
            ' "$signed_receipt" >/dev/null
          for pair in \
            "notary-submission.json:.notarization.submission_sha256" \
            "notary-wait.json:.notarization.wait_sha256" \
            "notary-log.json:.notarization.log_sha256" \
            "codesign.txt:.verification.codesign_log_sha256" \
            "gatekeeper.txt:.verification.gatekeeper_log_sha256"; do
            file=${pair%%:*}
            selector=${pair#*:}
            test "$(shasum -a 256 "$signed_root/$file" | awk '{print $1}')" = \
              "$(jq -er "$selector" "$signed_receipt")"
          done
          signed_binary="$signed_root/hf2q-aarch64-apple-darwin"
          chmod 0555 "$signed_binary"
          test "$(shasum -a 256 "$signed_binary" | awk '{print $1}')" = "$binary_sha"
          test "$(stat -f '%z' "$signed_binary")" = "$(jq -er .asset.size "$signed_receipt")"
          test "$(/usr/bin/lipo -archs "$signed_binary")" = arm64
          test "$(/usr/bin/vtool -show-build "$signed_binary" | awk '$1 == "minos" {print $2}')" = 14.0
          /usr/bin/codesign --verify --strict --all-architectures "$signed_binary"
          /usr/sbin/spctl --assess --type execute "$signed_binary"
          test "$(HF2Q_NO_COMPLETION_INSTALL=1 "$signed_binary" --version)" = \
            "hf2q $EXPECTED_VERSION"

          packed_build_root=$(mktemp -d "/private/var/tmp/hf2q-packed-build.XXXXXX")
          printf 'PACKED_BUILD_ROOT=%s\n' "$packed_build_root" >> "$GITHUB_ENV"
          crate="$build_root/hf2q-${EXPECTED_VERSION}.crate"
          test "$(shasum -a 256 "$crate" | awk '{print $1}')" = "$crate_sha"
          /usr/bin/tar -xzf "$crate" -C "$packed_build_root"
          package_root=$(cd "$packed_build_root/hf2q-${EXPECTED_VERSION}" && pwd -P)
          dependency_provenance_dir="$build_root/dependency-provenance"
          trusted_verifier="$GITHUB_WORKSPACE/scripts/verify_release_dependency_provenance.sh"
          test -f "$trusted_verifier"
          bash "$trusted_verifier" verify \
            "$dependency_provenance_dir" "$package_root/Cargo.lock"

          release_evidence="$RUNNER_TEMP/cache-lifecycle/standalone"
          mkdir -p "$release_evidence"
          sealed_binary="$release_evidence/hf2q-aarch64-apple-darwin"
          "$package_root/scripts/seal_release_binary.sh" \
            "$signed_binary" "$sealed_binary" "$binary_sha"
          for evidence in proof.json notary-submission.json notary-wait.json notary-log.json \
            codesign.txt gatekeeper.txt hf2q-aarch64-apple-darwin.sha256; do
            cp "$signed_root/$evidence" "$release_evidence/$evidence"
          done
          {
            printf 'PACKAGE_ROOT=%s\n' "$package_root"
            printf 'HF2Q_BIN=%s\n' "$sealed_binary"
            printf 'EXPECTED_BINARY_SHA256=%s\n' "$binary_sha"
            printf 'CRATE_SHA256=%s\n' "$crate_sha"
            printf 'DEPENDENCY_PROVENANCE_DIR=%s\n' "$dependency_provenance_dir"
          } >> "$GITHUB_ENV"

      - name: Run guarded cross-family cache lifecycle gate
        shell: bash
        env:
          OUT_ROOT: ${{ runner.temp }}/cache-lifecycle
        run: |
          set -euo pipefail
          cd "$PACKAGE_ROOT"
          exec scripts/run_release_gate_process_group.sh env \
            EXPECTED_SHA="$EXPECTED_SHA" \
            CRATE_SHA256="$CRATE_SHA256" \
            DEPENDENCY_PROVENANCE_DIR="$DEPENDENCY_PROVENANCE_DIR" \
            HF2Q_BIN="$HF2Q_BIN" \
            EXPECTED_BINARY_SHA256="$EXPECTED_BINARY_SHA256" \
            DEEPSEEK_MODEL="$DEEPSEEK_MODEL" \
            GEMMA_MODEL="$GEMMA_MODEL" \
            QWEN_MODEL="$QWEN_MODEL" \
            QWEN38_MODEL="$QWEN38_MODEL" \
            DEEPSEEK_MODEL_SHA256="$DEEPSEEK_MODEL_SHA256" \
            GEMMA_MODEL_SHA256="$GEMMA_MODEL_SHA256" \
            QWEN_MODEL_SHA256="$QWEN_MODEL_SHA256" \
            QWEN38_MODEL_SHA256="$QWEN38_MODEL_SHA256" \
            HF2Q_MODEL_VERIFICATION_CACHE_DIR="$RUNNER_TOOL_CACHE/hf2q-model-verification" \
            OUT_ROOT="$OUT_ROOT" \
            scripts/run_agentic_cache_release_gate.sh

      - name: Upload exact-artifact receipts and signed binary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-lifecycle-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/cache-lifecycle
          if-no-files-found: error
          retention-days: 30

      - name: Clean external packed build root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          packed_build_root=${PACKED_BUILD_ROOT:-}
          [[ -n "$packed_build_root" ]] || exit 0
          case "$packed_build_root" in
            /private/var/tmp/hf2q-packed-build.*)
              suffix=${packed_build_root#/private/var/tmp/hf2q-packed-build.}
              [[ -n "$suffix" && "$suffix" != */* ]] || exit 1
              ;;
            *)
              echo "refusing unsafe packed-build cleanup: $packed_build_root" >&2
              exit 1
              ;;
          esac
          [[ -d "$packed_build_root" && ! -L "$packed_build_root" ]] || exit 0
          rm -rf -- "$packed_build_root"
