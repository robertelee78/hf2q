[package]
name = "hf2q"
version = "0.1.21"
edition = "2021"
rust-version = "1.89.0"
build = "src/build_script.rs"
authors = ["Robert E. Lee <robert@agidreams.us>"]
description = "Pure Rust CLI for converting HuggingFace models to hardware-optimized formats and serving them over an OpenAI-compatible API on Apple Silicon"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/robertelee78/hf2q"
homepage = "https://github.com/robertelee78/hf2q"
documentation = "https://github.com/robertelee78/hf2q"
readme = "README.md"
keywords = ["llm", "gguf", "mlx", "quantization", "huggingface"]
categories = ["command-line-utilities", "science"]

# Drop heavy investigation logs + test fixtures + a reference PDF from
# the published tarball.  Pre-exclude the package was 38.4 MiB / 698
# files; the items below account for ~22 MiB and are all crate-internal
# (consumers don't run our tests, don't read our iter-log ADRs, don't
# need the TurboQuant paper to use the binary).  The smaller ADRs that
# document architectural decisions (ADR-008 candle-divorce, ADR-009
# parity, ADR-027 TQ-KV) stay in the published tarball so docs.rs / the
# crates.io page can link them.
exclude = [
    # Local agent configuration and generated model/evidence artifacts are
    # deliberately outside the crate, even when a developer has not added
    # them to a personal gitignore yet.
    ".agents/**",
    "CLAUDE.md.pre-ruflo*",
    "artifacts/**",
    # Test harnesses are excluded except the small source/fixture files that
    # crate-local unit tests read with include_str!. Keeping those makes the
    # exact registry archive testable after download.
    "tests/**",
    "!tests/completions.rs",
    "!tests/continuous_batching_throughput.rs",
    "!tests/convert_integration.rs",
    "!tests/distribution_cli.rs",
    "!tests/frictionless_cli.rs",
    "!tests/info_integration.rs",
    "!tests/lcp_partial_prefill_byte_identity.rs",
    "!tests/lcp_registry_unit.rs",
    "!tests/fixtures/deepseek_v4_encoding/**",
    "!tests/fixtures/ggml_quants/**",
    "!tests/fixtures/qwen38/**",
    "!tests/fixtures/structured_output/r2c/**",
    # Reference paper PDF (TurboQuant arxiv 2504.19874).
    "docs/2306.14048.pdf",
    # Iter-log ADRs — internal investigation diaries, not user-facing
    # architectural decisions.  Each is hundreds of KB to >1 MB.
    "docs/adr/diary/",
    # Investigation byproducts.
    "docs/spike-*.md",
    "docs/wave*.md",
    "docs/perf-traces/",
    "docs/phase0-*.json",
    "docs/research/",
    "archive/",
    "docs/reference-lock.md",
    "docs/adr/007-pathC/",
    # Per-runbook docs that ship at the URL via repository link.
    "docs/operator-peer-refresh-runbook.md",
]

[features]
default = []
# Enable RuVector self-learning
ruvector = ["dep:ruvector-core"]

[lints.rust]
# Release/operator builds must stay signal-clean. Experimental validation
# substrate belongs behind a real compile boundary, not a warning allowance.
warnings = "deny"

[dependencies]
safetensors = "0.7"
half = "2.4"
# Hash exact typed Metal-buffer bytes without violating mlx-native's typed
# slice contract by asking a BF16/F32 allocation for an untyped u8 view.
bytemuck = "1.25"

# HuggingFace integration
# Pin the first stable native-Xet client release. The blocking facade keeps
# hf2q's synchronous conversion pipeline while Xet runs its concurrent range
# reconstruction on the library-owned runtime.
hf-hub = { version = "=1.0.0", features = ["blocking"] }
# hf-hub 1.0 publishes caret Xet edges. Pin the coherent family here as well
# as in Cargo.lock so `cargo install` without --locked cannot select the
# currently stable-toolchain-incompatible 1.6 family independently.
hf-xet = "=1.5.3"
xet-client = "=1.5.3"
xet-core-structures = "=1.5.3"
xet-data = "=1.5.3"
xet-runtime = "=1.5.3"
globset = "0.4"
# ADR-045 canonical model-reference boundary. Keep these direct because the
# parser consumes both APIs instead of relying on incidental transitive pins.
percent-encoding = "=2.3.2"
url = "=2.5.8"
# Hugging Face non-LFS metadata carries the canonical Git blob SHA-1 in
# its ETag. Verify that identity instead of accepting a same-size rewrite.
sha1 = "=0.10.7"

# Self-learning intelligence — optional
ruvector-core = { version = "2.3", optional = true }

# CLI framework
clap = { version = "4.5", features = ["derive", "string"] }
# Dynamic registration scripts are protocol-coupled to clap_complete's exact
# output shape (see ADR-045 and src/cli/completion_install.rs).
clap_complete = { version = "=4.6.7", features = ["unstable-dynamic"] }

# Performance
rayon = "1.10"
memmap2 = "0.9"

# UX
indicatif = "0.18.4"
console = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
# Chat templates consume client JSON object order as part of their wire format.
serde_json = { version = "1", features = ["preserve_order"] }
# ADR-045 setup owns a closed, bounded TOML configuration document. Pin the
# parser/serializer so canonical producer bytes and hostile-input behavior do
# not drift under an otherwise unrelated dependency update.
toml = { version = "=1.1.4", default-features = false, features = ["parse", "display", "serde"] }
# The standalone stable-release record uses strict SemVer parsing at its
# untrusted wire boundary. Keep this direct instead of relying on a transitive
# crate.
semver = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# ADR-008: mlx-native is the sole inference/compute backend.
# DeepSeek-V4 Q3_K, Q8 embeddings, scalable indexer, sparse decode, and
# long-lived SlotAware Metal lifetime safety plus unlabeled GraphSession
# command-buffer drop performance, paired MoE prefill scheduling, and the
# machine-readable packed-affine capability contract and bounded D512
# prefill-tail reads plus exact GGML routing/capability and host-side GGUF
# evidence reads, typed resolved-dispatch traces, exact Q4_K inference, and
# direct packed Q5_K/Q6_K embedding gathers and deterministic lowest-index
# argmax tie handling require mlx-native 0.11.2.
mlx-native = "=0.11.2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# Transitive via tokenizers but we consume it directly to construct
# the WordPiece builder's AHashMap vocab (tokenizers 0.22 requires it).
ahash = "0.8"
# ADR-030 Phase 6 — Leviathan rejection sampling for temp > 0 spec-decode.
# rand 0.8 is already in the dep tree transitively; promote to direct.
rand = "0.8"

# Async runtime + HTTP server (for `serve` subcommand)
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
async-stream = "0.3"

# System info
sysinfo = "0.32"

# File locking (unix)
libc = "0.2"
# Descriptor-relative install-state operations. This is already lock-resident
# through tempfile, but distribution code needs a direct, feature-pinned API.
rustix = { version = "=1.1.4", features = ["fs", "process"] }

# Signal handling
ctrlc = { version = "3.4", features = ["termination"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Phase 2c vision preprocessing (ADR-005 iter 22+). Keep features minimal
# — PNG + JPEG cover OpenAI's `image_url` data-URI cases and the fixture
# shapes we use in tests.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# iter-20+ audit binaries (ADR-007): pattern matching for tok/s parsing
regex = "1"

# Jinja2 chat template rendering (pure Rust; matches llama.cpp's vendored
# common/jinja/ parser and mlx-lm's Python jinja2 behavior — see ADR-005 line 681).
#
# `minijinja-contrib`'s `pycompat` feature is the canonical adapter for
# chat templates authored against Python's Jinja2 (which transparently
# exposes Python-string methods like `.split()`, `.strip()`, `.lstrip()`,
# `.lower()` on strings). Without it, real-world templates that call
# e.g. `text.split('<channel|>')` — present in the Gemma 4 chat
# template's `strip_thinking` macro — fail at the second turn of any
# multi-turn chat with `UnknownMethod: string has no method named split`.
# Surfaced and fixed during ADR-005 Phase 2a iter-133 Iter A while
# closing the Open WebUI multi-turn AC 2509 harness.
minijinja = "2"
minijinja-contrib = { version = "2", default-features = false, features = ["pycompat"] }

# tempfile is used at runtime by the convert pipeline (ADR-012 P9b two-pass
# intermediate GGUF for qwen35 / qwen35moe activation capture) AND by tests.
# Promoted from dev-dep to runtime dep when P9b.2 / P9b.3b shipped.
tempfile = "3"

# ADR-007 Gate H (W21 iter-108b): parity_quality fixture writer hashes the
# GGUF + records git_head; sha2 + hex were previously dev-deps for ADR-012 P9
# corpus drift assertions, promoted to runtime deps here.
sha2 = "0.10"
hex = "0.4"

# HTTPS transport is shared by vision URL fetches and the diagnostic chat
# client. `blocking` remains required by vision; `json` and `stream` let chat
# send OpenAI requests and decode SSE without introducing another HTTP stack.
# `rustls-tls` keeps TLS off system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "stream", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# ADR-047 machine-local serve discovery. This wraps Apple's native DNS-SD
# service and exposes the LocalOnly interface plus Tokio browse/resolve streams.
async-dnssd = "=0.5.1"
# Setup host inventory reads fixed sysctl keys in-process; never trust caller
# facts or a PATH-resolved `sysctl` subprocess.
sysctl = { version = "=0.6.0", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
criterion = "0.5"
regex = "1"
tower = { version = "0.4", features = ["util"] }

# 2026-05-02 — H1 structural-audit integration test, item (b) of the
# decode-test-gap dossier (docs/research/decode-test-gap-2026-05-02.md).
# Parses src/serve/**/*.rs and fails on any new fn-body-local
# `const X: &[&str]` declaration — those are unreachable from `mod tests`
# (Rust fn-body const is fn-local-scope) and were the load-bearing variable
# in the same-day SPECIAL_TOKEN_STOPS 3-commit thrash. Features: `full`
# enables Item::Const + Stmt::Item parsing; `visit` enables the AST walker
# trait (gated separately in syn 2.x); `extra-traits` is for Debug/Eq
# derivations on AST nodes used in error messages.
syn = { version = "2", features = ["full", "extra-traits", "visit"] }

# ADR-005 Phase 2a iter-133 (Iter A): Open WebUI multi-turn streaming chat E2E test.
# The test spawns `hf2q serve` as a subprocess and drives `/v1/chat/completions`
# with `stream: true`, so it needs a real HTTP client capable of consuming a
# chunked SSE response stream. `reqwest` with the `stream` feature exposes
# `Response::bytes_stream()`, which lets us reassemble SSE chunks across TCP
# packet boundaries cleanly (raw `TcpStream` would force us to re-implement
# `Transfer-Encoding: chunked` and SSE framing). `rustls-tls` keeps the test
# build off any system OpenSSL link; the server is plain HTTP so we never
# negotiate TLS, but reqwest's default features include OpenSSL-linked TLS
# which would add a system dep for nothing.
# Note: reqwest is also a runtime dep (see [dependencies] above); Cargo
# unifies features. `json` + `stream` here add test-only capabilities on top
# of the runtime `blocking` + `rustls-tls` base.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Stream consumption helpers (`StreamExt`, `try_next`) for the SSE bytes_stream.
# `futures` is a runtime dep but only re-exports a subset; `futures-util` is
# the canonical home for `StreamExt::next`.
futures-util = "0.3"
# `tests/build_script_contract.rs` imports the build script as a normal test
# module, so its exact-logo compiler dependency must also be visible there.
resvg = { version = "=0.47.0", default-features = false }

[build-dependencies]
# ADR-051 compiles the exact hf2q.us SVG into deterministic native-protocol
# and ANSI raster assets. Keeping resvg out of the runtime path avoids adding
# logo rendering latency to every interactive hf2q invocation. The logo has
# paths only, so text/fonts and embedded raster formats remain disabled. Keep
# the proven 0.47 renderer pin independent of the Rust 1.89 floor.
resvg = { version = "=0.47.0", default-features = false }
base64 = "0.22"

# ADR-008: vendored candle patches removed (candle no longer used for inference).

# Local mlx-native development: place this in a gitignored .cargo/config.toml
# rather than this file, so fresh clones get the published crates.io version
# by default.
#
#   [patch.crates-io]
#   mlx-native = { path = "/opt/mlx-native" }
