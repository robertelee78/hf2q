# Curated engine set for opencode - quality over quantity
use_default_settings: true

general:
  instance_name: "opencode-local"
  privacypolicy_url: false
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  bind_address: "127.0.0.1"
  port: 8888
  secret_key: "__SEARXNG_SECRET__"
  limiter: false
  image_proxy: false
  http_protocol_version: "1.1"

outgoing:
  request_timeout: 8.0
  pool_connections: 100
  pool_maxsize: 20

